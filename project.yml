name: TesteMetaWord
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  TesteMetaWord:
    type: application
    platform: iOS
    sources:
      - path: TesteMetaWord
      # Single source of the composition grammar, shared with the model dataset (ml/).
      - path: ml/vocabulary.json
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.fabriciotosta.TesteMetaWord
        PRODUCT_NAME: TesteMetaWord
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TesteMetaWord
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
  TesteMetaWordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TesteMetaWordTests
    dependencies:
      - target: TesteMetaWord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fabriciotosta.TesteMetaWordTests
  TesteMetaWordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TesteMetaWordUITests
    dependencies:
      - target: TesteMetaWord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fabriciotosta.TesteMetaWordUITests
schemes:
  TesteMetaWord:
    build:
      targets:
        TesteMetaWord: all
    test:
      targets:
        - TesteMetaWordTests
        - TesteMetaWordUITests
    run:
      config: Debug
    archive:
      config: Release
